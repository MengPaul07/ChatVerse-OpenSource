services:
  chatverse:
    build: .
    ports:
      - "8787:8787"
    environment:
      - CHATVERSE_PROVIDER_PROTOCOL=${CHATVERSE_PROVIDER_PROTOCOL:-openai-chat}
      - CHATVERSE_PROVIDER_NAME=${CHATVERSE_PROVIDER_NAME:-}
      - CHATVERSE_API_KEY=${CHATVERSE_API_KEY:-}
      - CHATVERSE_BASE_URL=${CHATVERSE_BASE_URL:-}
      - CHATVERSE_MODEL=${CHATVERSE_MODEL:-}
      - CHATVERSE_PROVIDER_OPTIONS_JSON=${CHATVERSE_PROVIDER_OPTIONS_JSON:-{}}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - DIRECTOR_MODEL=${DIRECTOR_MODEL:-}
      - CHARACTER_MODEL=${CHARACTER_MODEL:-}
      - AUTHORING_MODEL=${AUTHORING_MODEL:-}
      - AUTHORING_RESEARCH_MODEL=${AUTHORING_RESEARCH_MODEL:-}
      - RESEARCH_MODEL=${RESEARCH_MODEL:-}
    restart: unless-stopped
